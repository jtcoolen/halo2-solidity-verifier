name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  SOLC_VERSION: 0.8.24

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install pinned solc
        run: |
          hash svm 2>/dev/null || cargo install svm-rs@0.5.4
          svm install "$SOLC_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "SOLC=$HOME/.cargo/bin/solc" >> "$GITHUB_ENV"
          "$HOME/.cargo/bin/solc" --version | grep "Version: $SOLC_VERSION"

      - name: Run test
        run: cargo test --workspace --all-features --all-targets

  solidity-variants:
    name: Solidity Variants
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install pinned solc
        run: |
          hash svm 2>/dev/null || cargo install svm-rs@0.5.4
          svm install "$SOLC_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "SOLC=$HOME/.cargo/bin/solc" >> "$GITHUB_ENV"
          "$HOME/.cargo/bin/solc" --version | grep "Version: $SOLC_VERSION"

      - name: Prepare SRS assets and compile IVC bench
        run: scripts/run_ivc_bench.sh --check-only

      - name: Compile Poseidon verifier variants
        run: |
          HALO2_SOLIDITY_RUN_EVM_TESTS=1 SRS_DIR="$PWD/.srs" cargo test --release \
            --features evm,truncated-challenges \
            poseidon_verifier_variants_compile_with_pinned_solc \
            -- --nocapture

      - name: Compile Poseidon verifier variants with gas checkpoints
        run: |
          HALO2_SOLIDITY_RUN_EVM_TESTS=1 SRS_DIR="$PWD/.srs" cargo test --release \
            --features evm,truncated-challenges,solidity-gas-checkpoints \
            poseidon_verifier_variants_compile_with_pinned_solc \
            -- --nocapture

      - name: Compile Poseidon verifier variants with fewer point sets
        run: |
          HALO2_SOLIDITY_RUN_EVM_TESTS=1 SRS_DIR="$PWD/.srs" cargo test --release \
            --features evm,truncated-challenges,outer-fewer-point-sets \
            poseidon_verifier_variants_compile_with_pinned_solc \
            -- --nocapture

      - name: Compile Poseidon gas variants with fewer point sets
        run: |
          HALO2_SOLIDITY_RUN_EVM_TESTS=1 SRS_DIR="$PWD/.srs" cargo test --release \
            --features evm,truncated-challenges,outer-fewer-point-sets,solidity-gas-checkpoints \
            poseidon_verifier_variants_compile_with_pinned_solc \
            -- --nocapture

      - name: Poseidon native/Solidity trace equivalence
        run: |
          HALO2_SOLIDITY_RUN_EVM_TESTS=1 SRS_DIR="$PWD/.srs" cargo test --release \
            --features evm,truncated-challenges,rust-verifier-trace,solidity-trace \
            native_midfall_verifier_trace_matches_solidity_trace \
            -- --nocapture

      - name: IVC trace-equivalence gas bench
        run: scripts/run_ivc_bench.sh --trace --skip-srs-download

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run fmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
