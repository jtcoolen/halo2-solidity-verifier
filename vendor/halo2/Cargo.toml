# Trimmed copy of the upstream halo2 v0.4.0 workspace, dropping members we
# don't need (halo2 facade, halo2_debug, p3_frontend). Surgical patches are
# applied to halo2_backend to expose the few `pub(crate)` items the
# halo2-solidity-verifier code-gen pipeline reads:
#   * VerifyingKey::cs (was pub(crate))
#   * permutation::VerifyingKey::commitments (added accessor)
#   * ParamsKZG::{g, g2, s_g2} (added accessors)
# See vendor/halo2/PATCHES.md for the diff sketch.
[workspace]
members = [
    "halo2_proofs",
    "halo2_frontend",
    "halo2_middleware",
    "halo2_backend",
]
resolver = "2"
