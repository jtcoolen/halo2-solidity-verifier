[package]
name = "halo2_solidity_verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
# Migration target: depend on midnight-proofs (the midfall fork of halo2 v0.4)
# directly via a path dep. midnight-proofs ships logup, the trash argument,
# the midnight KZG multi-prepare PCS, and a Keccak256 transcript with a
# domain-separator + 64-byte squeeze. midnight-curves carries BLS12-381
# natively (Fq scalar = midnight_curves::Fq, G1 = midnight_curves::G1Affine,
# pairing engine = midnight_curves::Bls12).
#
# The vendored halo2 v0.4 tree under vendor/halo2/ is now obsolete and is
# kept on disk only for the transcript / codegen tests that have not yet
# been ported (see MIGRATION.md). It is no longer in the build graph.
midnight-proofs = { path = "../midfall/proofs", default-features = false, features = ["keccak-transcript", "committed-instances", "circuit-params"] }
midnight-curves = { version = "0.2.0" }
ff = "0.13"
group = "0.13"
askama = { version = "0.12.0", features = ["config"], default-features = false }
hex = "0.4.3"
ruint = "1"
sha3 = "0.10"
itertools = "0.11.0"

# For feature = "evm"
#
# revm 19+ ships a Prague handler with the EIP-2537 BLS12-381 precompiles
# (G1ADD = 0x0b, G1MSM = 0x0c, G2ADD = 0x0d, G2MSM = 0x0e, PAIRING = 0x0f).
# Because default features are disabled, enable `blst` explicitly; otherwise
# Prague does not register those BLS precompiles and staticcalls hit empty
# accounts instead of doing curve arithmetic.
revm = { version = "19", default-features = false, features = ["std", "blst"], optional = true }

[dev-dependencies]
proptest = "1.6.0"
rand = "0.8.5"
revm = { version = "19", default-features = false, features = ["std", "blst"] }
rand_chacha = "0.3.1"
# Step 8: pull in midnight-circuits + midnight-zk-stdlib only as dev-deps so
# the lib build stays minimal. These provide the PoseidonExample circuit
# type the poseidon fixture (../midfall/proofs/solidity-verifier/fixtures/
# poseidon/{proof.bin, vk.bin, instance.be}) was generated against, which
# we need to deserialize the VK and rebuild the SolidityGenerator.
midnight-circuits = { path = "../midfall/circuits", features = ["testing"] }
midnight-zk-stdlib = { path = "../midfall/zk_stdlib", features = ["testing"] }
# halo2_maingate is upstream maingate from halo2wrong, pinned to v0.3-shaped
# halo2_proofs. It does not compile against halo2 v0.4 (which we now use), so
# the maingate-backed render tests in src/test.rs are commented out for the
# duration of the migration. Once a v0.4-compatible maingate is available the
# dep can be re-enabled.
# halo2_maingate = { git = "https://github.com/privacy-scaling-explorations/halo2wrong", tag = "v2024_01_31", package = "maingate" }

# Step 8 cross-crate path patches.
#
# midnight-zk-stdlib + midnight-circuits depend on `midnight-proofs` /
# `midnight-curves` / `midnight-circuits` from crates.io and on
# `blake2b_halo2` from a Github source. We redirect each of those to the
# local midfall checkout so cargo resolves a single canonical copy of
# every dep — otherwise `Hashable<G1Projective>` etc. become ambiguous
# across two isomorphic-but-distinct crate copies.
[patch.crates-io]
midnight-proofs = { path = "../midfall/proofs" }
midnight-curves = { path = "../midfall/curves" }
midnight-circuits = { path = "../midfall/circuits" }

[patch."https://github.com/midnightntwrk/midnight-zk"]
midnight-proofs = { path = "../midfall/proofs" }
midnight-curves = { path = "../midfall/curves" }
midnight-circuits = { path = "../midfall/circuits" }

[patch."https://github.com/eryxcoop/blake2b_halo2"]
blake2b_halo2 = { path = "../midfall/vendor/blake2b_halo2" }

[features]
default = []
evm = ["dep:revm"]
# Enables Askama trace/log branches in the default Solidity render path.
# Explicit `render_trace*` helpers can still be used without this feature.
solidity-trace = []

[[example]]
name = "separately"
required-features = ["evm"]

[[example]]
name = "trace"
required-features = ["evm"]

[[example]]
name = "compare_trace"
required-features = ["evm"]

[[example]]
name = "probe_revert"
required-features = ["evm"]

[[example]]
name = "check_delta"
