[package]
name = "halo2_solidity_verifier"
version = "0.1.0"
edition = "2021"

[dependencies]
# halo2_proofs is the trimmed v0.4.0 vendor under vendor/halo2/ with surgical
# patches that expose `VerifyingKey::cs()`, the permutation commitments, the
# KZG SRS accessors, and the ConstraintSystemBack cs walkers (see
# vendor/halo2/PATCHES.md for the diffs). v0.4 transitively pulls halo2curves
# 0.7, which ships `bls12_381::Bls12381 : pairing::Engine` so the prover side
# of the BLS port can swap to a real BLS-KZG backend.
halo2_proofs = { path = "vendor/halo2/halo2_proofs" }
halo2_middleware = { path = "vendor/halo2/halo2_middleware" }
halo2_backend = { path = "vendor/halo2/halo2_backend" }
halo2curves = { version = "0.7", default-features = false }
askama = { version = "0.12.0", features = ["config"], default-features = false }
hex = "0.4.3"
ruint = "1"
sha3 = "0.10"
itertools = "0.11.0"

# For feature = "evm"
#
# revm 19+ ships a Prague handler with the EIP-2537 BLS12-381 precompiles
# (G1ADD = 0x0b, G1MSM = 0x0c, G2ADD = 0x0d, G2MSM = 0x0e, PAIRING = 0x0f),
# which is what the BLS-flavored Solidity verifier exercises. Earlier revm
# versions don't know about these precompiles and treat them as empty
# accounts, so the verifier reverts with "stack too deep" symptoms.
revm = { version = "19", default-features = false, optional = true }

[dev-dependencies]
proptest = "1.6.0"
rand = "0.8.5"
revm = { version = "19", default-features = false }
# halo2_maingate is upstream maingate from halo2wrong, pinned to v0.3-shaped
# halo2_proofs. It does not compile against halo2 v0.4 (which we now use), so
# the maingate-backed render tests in src/test.rs are commented out for the
# duration of the migration. Once a v0.4-compatible maingate is available the
# dep can be re-enabled.
# halo2_maingate = { git = "https://github.com/privacy-scaling-explorations/halo2wrong", tag = "v2024_01_31", package = "maingate" }

[features]
default = []
evm = ["dep:revm"]

[[example]]
name = "separately"
required-features = ["evm"]

[[example]]
name = "trace"
required-features = ["evm"]

[[example]]
name = "compare_trace"
required-features = ["evm"]

[[example]]
name = "probe_revert"
required-features = ["evm"]

[[example]]
name = "check_delta"
